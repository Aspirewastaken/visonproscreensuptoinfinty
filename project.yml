name: VisionProScreensUpToInfinity
options:
  bundleIdPrefix: com.aspirewastaken.visionproscreensuptoinfinity
  deploymentTarget:
    macOS: "15.2"
    visionOS: "2.2"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_PREVIEWS: true

targets:
  VisionScreenMac:
    type: application
    platform: macOS
    deploymentTarget:
      macOS: "15.2"
    sources:
      - path: macOS
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aspirewastaken.visionproscreensuptoinfinity.mac
        PRODUCT_NAME: VisionScreenMac
        MACOSX_DEPLOYMENT_TARGET: "15.2"
        INFOPLIST_FILE: macOS/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: macOS/App/VisionScreenMac.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: true
    info:
      path: macOS/App/Info.plist
      properties:
        CFBundleName: VisionScreenMac
        CFBundleDisplayName: "Vision Screen Mac"
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        CFBundlePackageType: APPL
        CFBundleExecutable: $(EXECUTABLE_NAME)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSScreenCaptureUsageDescription: "VisionScreen needs screen recording permission to capture virtual displays and stream them to your Apple Vision Pro."
        NSLocalNetworkUsageDescription: "VisionScreen uses the local network to stream display content to your Apple Vision Pro."
        NSBonjourServices:
          - _visionproscreensuptoinfinity._tcp
    entitlements:
      path: macOS/App/VisionScreenMac.entitlements
      properties:
        com.apple.security.app-sandbox: false

  VisionProScreens:
    type: application
    platform: visionOS
    deploymentTarget:
      visionOS: "2.2"
    sources:
      - path: visionOS
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aspirewastaken.visionproscreensuptoinfinity.vision
        PRODUCT_NAME: VisionProScreens
        INFOPLIST_FILE: visionOS/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: visionOS/App/VisionProScreens.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    info:
      path: visionOS/App/Info.plist
      properties:
        CFBundleName: VisionProScreens
        CFBundleDisplayName: "Vision Pro Screens"
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        CFBundlePackageType: APPL
        CFBundleExecutable: $(EXECUTABLE_NAME)
        UIApplicationSupportsMultipleScenes: true
        NSLocalNetworkUsageDescription: "VisionProScreens uses the local network to connect to your Mac and receive display streams."
        NSBonjourServices:
          - _visionproscreensuptoinfinity._tcp
    entitlements:
      path: visionOS/App/VisionProScreens.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true

  SharedTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SharedTests
    dependencies:
      - target: VisionScreenMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aspirewastaken.visionproscreensuptoinfinity.sharedtests
        INFOPLIST_FILE: Tests/SharedTests/Info.plist
    info:
      path: Tests/SharedTests/Info.plist
      properties:
        CFBundleName: SharedTests
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        CFBundlePackageType: BNDL

  MacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/macOSTests
    dependencies:
      - target: VisionScreenMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aspirewastaken.visionproscreensuptoinfinity.mactests
        INFOPLIST_FILE: Tests/macOSTests/Info.plist
    info:
      path: Tests/macOSTests/Info.plist
      properties:
        CFBundleName: MacTests
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        CFBundlePackageType: BNDL
